name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q
        # conftest.py provisions throwaway secrets + a temp SQLite DB, so no
        # real env / database is needed here.
      - name: Verify migrations apply on a fresh DB
        working-directory: backend
        env:
          # alembic only needs DATABASE_URL (it imports models, not config).
          DATABASE_URL: "sqlite:///./_ci_migrations.db"
        run: alembic upgrade head

  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci reaches the registry ~700 times and has no retry of its own, so
      # a single dropped connection fails the whole job. Historically this was
      # our only red build: the same commit would go red then green on a
      # re-run, which trains people to ignore CI. Three attempts with a pause.
      - name: Install dependencies
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt/3) — retrying in 15s"
            sleep 15
          done
          exit 1
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
      # Blocking: the backlog was triaged (python-jose/ecdsa dropped, Next
      # bumped past the high-severity postcss issue), so these now fail the
      # build. npm audit gates on high/critical only — moderate is tracked via
      # Dependabot without blocking every PR.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit (backend)
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt
